name: CABBAGE framework integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cabbage.txt
      - run: python -m cabbage doctor
      - run: python -m unittest discover -s cabbage_tests -v
      - run: python -m unittest tests.app.test_paper_trading -v
      - run: python -m cabbage backtest
